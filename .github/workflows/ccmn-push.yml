name: 长江现货行情推送

on:
  schedule:
    # ⚠️ GitHub Actions 的 schedule 必须写死在本文件里，读不到 config.yaml（平台限制）。
    #    改 Actions 的定时就改这一行；config.yaml 的 cron 只管本地 scheduler.py。
    #    时间是 UTC，北京时间 = UTC + 8。
    #
    #    "*/30 * * * *"  每 30 分钟          ← 当前：调试用
    #    "30 2 * * *"    每天 UTC 02:30 = 北京 10:30（数据每日 10:00-10:20 更新）
    #    "30 2 * * 1-5"  工作日北京 10:30
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只抓取不推送"
        type: boolean
        default: false
      force:
        description: "忽略 skip_if_unchanged 强制推送"
        type: boolean
        default: false

concurrency:
  group: ccmn-push
  cancel-in-progress: false

permissions:
  contents: write        # keepalive 步骤需要推空提交

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 让 skip_if_unchanged 在无状态 runner 上也能工作
      - name: 恢复推送状态
        uses: actions/cache/restore@v4
        with:
          path: .push_state.json
          key: ccmn-push-state-${{ github.run_id }}
          restore-keys: ccmn-push-state-

      - name: 执行抓取与推送
        env:
          TZ: Asia/Shanghai
        run: |
          python3 run.py \
            ${{ inputs.dry_run  && '--dry-run' || '' }} \
            ${{ inputs.force    && '--force'   || '' }}

      - name: 保存推送状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .push_state.json
          key: ccmn-push-state-${{ github.run_id }}

      - name: 上传 Excel 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccmn-xlsx-${{ github.run_id }}
          path: output/*.xlsx
          retention-days: 7
          if-no-files-found: warn

      - name: 上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ccmn-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      # GitHub 会在仓库连续 60 天无活动后自动禁用定时 workflow。
      # 超过 45 天没有新提交时打一个空提交把计时器归零，避免定时任务被停掉。
      - name: 保活（防定时任务被自动禁用）
        if: github.event_name == 'schedule'
        run: |
          LAST=$(git log -1 --format=%ct)
          DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "距上次提交 ${DAYS} 天（阈值 45 天）"
          if [ "$DAYS" -ge 45 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive — 防定时任务被 GitHub 自动禁用"
            git push
            echo "已推空提交保活"
          fi
