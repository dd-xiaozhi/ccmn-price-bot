# 长江现货抓取 + 企微推送 配置
#
# 本文件入库。scheduler.py 每 2 秒检查一次改动，改完立即生效，无需重启。
#
# ⚠️ webhook 含明文凭据，拿到的人可以往群里发任意消息。仓库务必保持私有。
#    需要撤销只能在企微后台重建群机器人换 key。
#
# 任意字符串支持 ${ENV_VAR} 与 ${ENV_VAR:-默认值} 插值。

# ── 抓取目标 ────────────────────────────────────────────────
market: 长江现货          # 可选：长江现货 / 长江综合
markets_all: false        # true = 忽略 market，导出全部市场（每市场一个 sheet）

# ── 输出 ────────────────────────────────────────────────────
output:
  dir: output
  # 占位符：{market} {date} {datetime}
  filename: "ccmn_{market}_{datetime}.xlsx"
  keep_days: 7            # 清理 N 天前的旧文件；0 = 不清理

# ── 定时调度 ────────────────────────────────────────────────
# ⚠️ 只对本地 scheduler.py 生效。
#    GitHub Actions 的 schedule 读不到本文件（平台限制，必须写死在 workflow 里），
#    改 Actions 的定时请直接改 .github/workflows/ccmn-push.yml 的 cron。
schedule:
  # 标准 5 段 cron：分 时 日 月 周
  #   "*/30 * * * *"  每 30 分钟（当前：调试用）
  #   "30 10 * * *"   每天 10:30（数据每日 10:00-10:20 更新，10:30 跑较稳）
  #   "30 10 * * 1-5" 工作日 10:30
  cron: "*/30 * * * *"
  timezone: Asia/Shanghai
  run_on_start: false     # 启动时先立刻跑一次

# ── 企业微信机器人 ──────────────────────────────────────────
wecom:
  enabled: true
  webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=a5f127af-2d9c-42ad-a0ca-b680c812bfa4"
  send_summary: true      # 先发一条 markdown 行情摘要
  send_file: true         # 再发 Excel 文件
  summary_top_n: 10       # 摘要里展示的品名数量（按涨跌绝对值排序）
  mention_all: false      # 摘要中 @所有人
  notify_on_error: true   # 任务失败时往群里发一条告警（无人值守时别关）

# ── 推送策略 ────────────────────────────────────────────────
push:
  # true = 数据与上次推送完全一致时跳过。
  # 数据每天只更新一次，高频 cron 下开启可避免重复刷屏；固定每天一次后无所谓。
  skip_if_unchanged: false
  state_file: .push_state.json

# ── 日志 ────────────────────────────────────────────────────
log:
  file: logs/ccmn.log
  level: INFO             # DEBUG / INFO / WARNING / ERROR
